# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# games
windowrule = fullscreen, class:^steam_app_.*$

# application placement
windowrule = workspace 2, class:^(brave|brave-browser|BraveBrowser)$
windowrule = workspace 3, class:steam
windowrule = workspace 3, title:^Battle\.net$
windowrule = workspace 9, class:discord
windowrule = workspace 10, class:^((s|S)potify)$
