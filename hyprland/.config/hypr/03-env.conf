# programs for LAUNCH
$terminal = kitty
$fileManager = dolphin
$menu = rofi -no-lazy-grab -show drun -modi run,drun -run-command "uwsm app -- {cmd}" -normal-window -theme "${XDG_CONFIG_HOME}/rofi/launcher/spotlight-dark"

# `Windows` key as MAIN MOD
$mainMod = SUPER

# other
$wallpaper = ~/doc/pic/spock_the_dj_wp_21x9.png

# Global environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
